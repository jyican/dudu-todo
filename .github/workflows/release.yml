name: release

# 推一个 v* 标签(如 v0.1.0)即触发,自动出 Windows + macOS 安装包;
# 也可在 Actions 页面手动运行(workflow_dispatch)做测试构建。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write # 创建 Release 需要
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin" # Intel + Apple Silicon 通用
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "dudu tools v__VERSION__"
          releaseBody: "自动构建的 Windows / macOS 安装包。macOS 为 Intel+Apple Silicon 通用版。"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # 手动触发(无 tag)时,把安装包作为工作流产物上传,方便直接下载
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
          if-no-files-found: ignore
